<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>헛둘 화공 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a202c; color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; min-height: 100vh;
        }
        #game-container {
            border: 4px solid #4a5568; border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); background: #000;
        }
        .controls {
            margin: 15px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            background: #2d3748; padding: 12px 18px; border-radius: 8px; width: 800px;
        }
        
        /* 닉네임 입력창 스타일 */
        .nickname-box {
            display: flex; align-items: center; gap: 8px;
        }
        .input-text {
            padding: 8px 12px; border-radius: 6px; border: 1px solid #4a5568;
            background: #1a202c; color: white; font-size: 14px; outline: none;
        }
        .input-text:focus { border-color: #63b3ed; }

        .btn {
            background-color: #3182ce; color: white; border: none;
            padding: 8px 16px; font-size: 14px; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background-color: #2b6cb0; }
        .btn-danger { background-color: #e53e3e; }
        .btn-danger:hover { background-color: #c53030; }

        .file-upload-label {
            background-color: #805ad5; color: white; padding: 8px 16px;
            font-size: 14px; font-weight: bold; border-radius: 6px;
            cursor: pointer; transition: all 0.2s; display: inline-block;
        }
        .file-upload-label:hover { background-color: #6b46c1; }
        #avatar-input { display: none; }

        .grid-section {
            width: 800px; margin-top: 10px; background: #2d3748;
            padding: 15px; border-radius: 8px;
        }
        .grid-title { font-size: 14px; font-weight: bold; color: #a0aec0; margin-bottom: 10px; }
        #screens-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px; min-height: 120px;
        }
        .screen-card {
            background: #1a202c; border: 2px solid #4a5568; border-radius: 8px;
            overflow: hidden; position: relative; cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .screen-card:hover { transform: translateY(-2px); border-color: #63b3ed; }
        .screen-card video { width: 100%; height: 130px; object-fit: cover; display: block; background: #000; }
        .screen-card .label {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 12px;
            padding: 4px 8px; text-align: center; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }

        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 2000;
            justify-content: center; align-items: center; flex-direction: column;
        }
        #modal-box {
            position: relative; background: #2d3748; padding: 15px; border-radius: 12px;
            max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column; align-items: center;
        }
        #large-video { max-width: 80vw; max-height: 70vh; border-radius: 6px; background: #000; }
        .modal-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 12px;">🎮 2D 메타버스 + 닉네임 설정</h2>
    <div id="game-container"></div>

    <div class="controls">
        <!-- 닉네임 설정 칸 -->
        <div class="nickname-box">
            <input type="text" id="nickname-input" class="input-text" placeholder="닉네임 입력" value="플레이어">
            <button id="update-name-btn" class="btn">이름 변경</button>
        </div>

        <!-- 이미지 업로드 -->
        <label for="avatar-input" class="file-upload-label">🖼️ 캐릭터 이미지 변경</label>
        <input type="file" id="avatar-input" accept="image/*">

        <!-- 화면 공유 버튼 -->
        <button id="share-btn" class="btn" style="margin-left: auto;">🖥️ 내 화면 공유하기</button>
    </div>

    <div class="grid-section">
        <div class="grid-title">📺 참가자 공유 화면 목록 (클릭 시 크게 보기)</div>
        <div id="screens-grid"></div>
    </div>

    <div id="modal-overlay">
        <div id="modal-box">
            <div class="modal-header">
                <span id="modal-title" style="font-weight: bold;"></span>
                <button id="close-modal-btn" class="btn btn-danger" style="padding: 4px 10px;">닫기 ✕</button>
            </div>
            <video id="large-video" autoplay playsinline controls></video>
        </div>
    </div>

    <script>
        const socket = io();
        const otherPlayers = {};
        let peer = null;
        let localStream = null;
        let gameScene = null;
        let myName = "플레이어";

        const screensGrid = document.getElementById('screens-grid');
        const shareBtn = document.getElementById('share-btn');
        const avatarInput = document.getElementById('avatar-input');
        const nameInput = document.getElementById('nickname-input');
        const updateNameBtn = document.getElementById('update-name-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const largeVideo = document.getElementById('large-video');
        const modalTitle = document.getElementById('modal-title');

        socket.on('connect', () => {
            if (peer) peer.destroy();
            peer = new Peer(socket.id);

            peer.on('call', (call) => {
                if (localStream) call.answer(localStream);
                else call.answer();

                call.on('stream', (remoteStream) => {
                    const targetName = otherPlayers[call.peer] ? otherPlayers[call.peer].name : `User ${call.peer.substring(0, 4)}`;
                    addScreenToGrid(call.peer, remoteStream, `${targetName}의 화면`);
                });
            });
        });

        socket.on('activeScreenShares', (sharingUserIds) => {
            sharingUserIds.forEach(id => { if (id !== socket.id) connectToSharingUser(id); });
        });

        socket.on('userStartedShare', (sharingId) => { connectToSharingUser(sharingId); });
        socket.on('userStoppedShare', (sharingId) => { removeScreenFromGrid(sharingId); });

        function connectToSharingUser(targetId) {
            if (!peer) return;
            const call = peer.call(targetId, localStream || new MediaStream());
            call.on('stream', (remoteStream) => {
                const targetName = otherPlayers[targetId] ? otherPlayers[targetId].name : `User ${targetId.substring(0, 4)}`;
                addScreenToGrid(targetId, remoteStream, `${targetName}의 화면`);
            });
        }

        // --- Phaser 3 게임 환경 ---
        const config = {
            type: Phaser.AUTO, width: 800, height: 450,
            parent: 'game-container', pixelArt: true,
            physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);

        function preload() {
            createDummySprite(this, 'myPlayer', '#48bb78');
            createDummySprite(this, 'otherPlayer', '#ed8936');
            createGridBackground(this);
        }

        function create() {
            gameScene = this;
            this.add.image(400, 225, 'bgGrid');

            this.myPlayer = this.physics.add.sprite(400, 225, 'myPlayer');
            this.myPlayer.setCollideWorldBounds(true);
            this.myLabel = this.add.text(400, 195, myName, {
                fontSize: '12px', fill: '#ffffff', backgroundColor: '#00000088', padding: { x: 4, y: 2 }
            }).setOrigin(0.5);

            this.cursors = this.input.keyboard.createCursorKeys();

            socket.on('currentPlayers', (players) => {
                Object.keys(players).forEach((id) => {
                    if (id !== socket.id) addOtherPlayer(gameScene, id, players[id].x, players[id].y, players[id].name, players[id].avatar);
                });
            });

            socket.on('newPlayer', (playerInfo) => {
                addOtherPlayer(gameScene, playerInfo.id, playerInfo.x, playerInfo.y, playerInfo.name, playerInfo.avatar);
            });

            socket.on('playerMoved', (playerInfo) => {
                if (otherPlayers[playerInfo.id]) {
                    otherPlayers[playerInfo.id].sprite.setPosition(playerInfo.x, playerInfo.y);
                    otherPlayers[playerInfo.id].label.setPosition(playerInfo.x, playerInfo.y - (otherPlayers[playerInfo.id].sprite.displayHeight / 2 + 10));
                }
            });

            // 상대방이 이름 변경했을 때 수신
            socket.on('playerRenamed', (data) => {
                if (otherPlayers[data.id]) {
                    otherPlayers[data.id].name = data.name;
                    otherPlayers[data.id].label.setText(data.name);
                    
                    // 그리드 카드 이름도 업데이트
                    const cardLabel = document.querySelector(`#card-${data.id} .label`);
                    if (cardLabel) cardLabel.innerText = `${data.name}의 화면`;
                }
            });

            socket.on('playerAvatarChanged', (data) => {
                if (otherPlayers[data.id]) {
                    updatePlayerTexture(gameScene, otherPlayers[data.id].sprite, data.avatarKey, data.avatarBase64);
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) {
                    otherPlayers[id].sprite.destroy();
                    otherPlayers[id].label.destroy();
                    delete otherPlayers[id];
                }
                removeScreenFromGrid(id);
            });
        }

        function update() {
            if (!this.myPlayer) return;
            const speed = 200;
            let vx = 0, vy = 0;

            if (this.cursors.left.isDown) vx = -speed;
            else if (this.cursors.right.isDown) vx = speed;
            if (this.cursors.up.isDown) vy = -speed;
            else if (this.cursors.down.isDown) vy = speed;

            this.myPlayer.setVelocity(vx, vy);
            const offset = (this.myPlayer.displayHeight / 2) + 10;
            this.myLabel.setPosition(this.myPlayer.x, this.myPlayer.y - offset);

            if (vx !== 0 || vy !== 0) {
                socket.emit('playerMovement', { x: Math.round(this.myPlayer.x), y: Math.round(this.myPlayer.y) });
            }
        }

        function addOtherPlayer(scene, id, x, y, name, avatarBase64) {
            const avatarKey = `avatar-${id}`;
            let sprite = scene.physics.add.sprite(x, y, 'otherPlayer');

            if (avatarBase64) {
                updatePlayerTexture(scene, sprite, avatarKey, avatarBase64);
            }

            const displayName = name || `User ${id.substring(0, 4)}`;
            const offset = (sprite.displayHeight / 2) + 10;
            const label = scene.add.text(x, y - offset, displayName, {
                fontSize: '12px', fill: '#ffeb3b', backgroundColor: '#00000088', padding: { x: 4, y: 2 }
            }).setOrigin(0.5);

            otherPlayers[id] = { sprite, label, name: displayName };
        }

        function updatePlayerTexture(scene, spriteObj, keyName, base64Data) {
            if (scene.textures.exists(keyName)) scene.textures.remove(keyName);
            scene.textures.addBase64(keyName, base64Data);
            scene.textures.once(`addtexture-${keyName}`, () => {
                spriteObj.setTexture(keyName);
                spriteObj.setDisplaySize(40, 40);
            });
        }

        // --- ✏️ 닉네임 변경 이벤트 ---
        updateNameBtn.addEventListener('click', changeNickname);
        nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') changeNickname(); });

        function changeNickname() {
            const newName = nameInput.value.trim();
            if (!newName) return;

            myName = newName;
            gameScene.myLabel.setText(myName);
            socket.emit('changeName', myName);

            // 내 화면 공유 카드 이름 업데이트
            const myCardLabel = document.querySelector(`#card-${socket.id} .label`);
            if (myCardLabel) myCardLabel.innerText = `${myName}의 화면 (나)`;
        }

        // --- 🖼️ 이미지 업로드 이벤트 ---
        avatarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const base64Image = event.target.result;
                updatePlayerTexture(gameScene, gameScene.myPlayer, `avatar-${socket.id}`, base64Image);
                socket.emit('changeAvatar', base64Image);
            };
            reader.readAsDataURL(file);
        });

        // --- 🖥️ 화면 공유 이벤트 ---
        shareBtn.addEventListener('click', async () => {
            if (localStream) { stopScreenShare(); return; }
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: false });
                addScreenToGrid(socket.id, localStream, `${myName}의 화면 (나)`);
                shareBtn.innerText = '🛑 공유 중단하기'; shareBtn.classList.add('btn-danger');
                socket.emit('startScreenShare');
                Object.keys(otherPlayers).forEach(targetId => peer.call(targetId, localStream));
                localStream.getVideoTracks()[0].onended = () => stopScreenShare();
            } catch (err) { console.error(err); }
        });

        function stopScreenShare() {
            if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
            removeScreenFromGrid(socket.id);
            shareBtn.innerText = '🖥️ 내 화면 공유하기'; shareBtn.classList.remove('btn-danger');
            socket.emit('stopScreenShare');
        }

        function addScreenToGrid(peerId, stream, title) {
            if (document.getElementById(`card-${peerId}`)) return;
            if (stream.getVideoTracks().length === 0) return;

            const card = document.createElement('div');
            card.className = 'screen-card'; card.id = `card-${peerId}`;
            const video = document.createElement('video');
            video.autoplay = true; video.playsinline = true; video.muted = true; video.srcObject = stream;
            const label = document.createElement('div');
            label.className = 'label'; label.innerText = title;

            card.appendChild(video); card.appendChild(label); screensGrid.appendChild(card);
            card.addEventListener('click', () => openLargeModal(stream, title));
        }

        function removeScreenFromGrid(peerId) {
            const card = document.getElementById(`card-${peerId}`);
            if (card) card.remove();
        }

        function openLargeModal(stream, title) {
            modalTitle.innerText = title; largeVideo.srcObject = stream; modalOverlay.style.display = 'flex';
        }

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            modalOverlay.style.display = 'none'; largeVideo.srcObject = null;
        });

        function createDummySprite(scene, key, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color; ctx.beginPath(); ctx.arc(16, 16, 14, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            scene.textures.addBase64(key, canvas.toDataURL());
        }

        function createGridBackground(scene) {
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 450;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#242b35'; ctx.fillRect(0, 0, 800, 450);
            ctx.strokeStyle = '#2d3748'; ctx.lineWidth = 1;
            for (let x = 0; x < 800; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 450); ctx.stroke(); }
            for (let y = 0; y < 450; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke(); }
            scene.textures.addBase64('bgGrid', canvas.toDataURL());
        }
    </script>
</body>
</html>
