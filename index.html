<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 메타버스 - 초경량 버전</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a202c; color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: row; align-items: flex-start;
            justify-content: center; gap: 15px;
            padding: 15px; min-height: 100vh;
        }
        #main-area { display: flex; flex-direction: column; align-items: center; }
        #game-container {
            border: 3px solid #4a5568; border-radius: 8px;
            background: #111;
        }
        .controls {
            margin: 10px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            background: #2d3748; padding: 10px 15px; border-radius: 8px; width: 800px;
        }
        .input-text {
            padding: 6px 10px; border-radius: 4px; border: 1px solid #4a5568;
            background: #1a202c; color: white; font-size: 13px; outline: none;
        }
        .btn {
            background-color: #3182ce; color: white; border: none;
            padding: 6px 14px; font-size: 13px; font-weight: bold;
            border-radius: 4px; cursor: pointer;
        }
        .btn-danger { background-color: #e53e3e; }
        .file-label {
            background-color: #805ad5; color: white; padding: 6px 14px;
            font-size: 13px; font-weight: bold; border-radius: 4px; cursor: pointer;
        }
        #avatar-input { display: none; }

        .grid-section { width: 800px; margin-top: 10px; background: #2d3748; padding: 12px; border-radius: 8px; }
        .grid-title { font-size: 13px; color: #a0aec0; margin-bottom: 8px; font-weight: bold; }
        #screens-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .screen-card { background: #1a202c; border: 1px solid #4a5568; border-radius: 6px; overflow: hidden; position: relative; cursor: pointer; }
        .screen-card video { width: 100%; height: 110px; object-fit: cover; display: block; background: #000; }
        .screen-card .label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: #fff; font-size: 11px; padding: 3px; text-align: center; }

        /* --- 채팅 패널 (오른쪽) --- */
        #chat-panel {
            width: 300px; align-self: stretch;
            min-height: 500px; max-height: calc(100vh - 30px);
            background: #2d3748; border-radius: 8px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 12px rgba(0,0,0,0.4);
        }
        #chat-header {
            padding: 10px 12px; font-size: 14px; font-weight: bold;
            color: #e2e8f0; border-bottom: 1px solid #4a5568; flex-shrink: 0;
        }
        #chat-messages {
            flex: 1; overflow-y: auto; padding: 10px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .chat-msg { display: flex; gap: 8px; align-items: flex-start; }
        .chat-msg .avatar {
            width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
            object-fit: cover; background: #1a202c;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; color: #fff;
        }
        .chat-msg .body { flex: 1; min-width: 0; }
        .chat-msg .chat-name { font-size: 11px; color: #90cdf4; font-weight: bold; margin-bottom: 3px; }
        .chat-msg .chat-text {
            font-size: 13px; background: #1a202c; color: #edf2f7;
            padding: 6px 9px; border-radius: 6px; line-height: 1.4;
            word-break: break-word; white-space: pre-wrap;
        }
        #chat-input-row {
            display: flex; gap: 6px; padding: 10px;
            border-top: 1px solid #4a5568; flex-shrink: 0;
        }
        #chat-input { flex: 1; width: auto; }

        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center;
        }
        #modal-box { background: #2d3748; padding: 10px; border-radius: 8px; text-align: center; }
        #large-video { max-width: 80vw; max-height: 70vh; background: #000; }
    </style>
</head>
<body>

    <div id="main-area">

    <h3 style="margin-bottom: 8px;">헛둘 화동 테스트</h3>
    <div id="game-container"></div>

    <div class="controls">
        <input type="text" id="nickname-input" class="input-text" placeholder="닉네임" value="플레이어" style="width: 110px;">
        <button id="update-name-btn" class="btn">이름 변경</button>

        <label for="avatar-input" class="file-label">🖼️ 캐릭터 이미지</label>
        <input type="file" id="avatar-input" accept="image/*">

        <button id="share-btn" class="btn" style="margin-left: auto;">🖥️ 화면 공유</button>
    </div>

    <div class="grid-section">
        <div class="grid-title">📺 공유 화면 그리드</div>
        <div id="screens-grid"></div>
    </div>

    </div><!-- /main-area -->

    <div id="chat-panel">
        <div id="chat-header">💬 채팅</div>
        <div id="chat-messages"></div>
        <div id="chat-input-row">
            <input type="text" id="chat-input" class="input-text" placeholder="메시지 입력..." maxlength="500">
            <button id="chat-send-btn" class="btn">전송</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-box">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                <span id="modal-title" style="font-weight: bold; font-size: 14px;"></span>
                <button id="close-modal-btn" class="btn btn-danger" style="padding: 2px 8px;">닫기 ✕</button>
            </div>
            <video id="large-video" autoplay playsinline controls></video>
        </div>
    </div>

    <script>
        const socket = io();
        const otherPlayers = {};
        let peer = null;
        let localStream = null;
        let gameScene = null;
        let myName = "플레이어";
        let lastSendTime = 0;

        const screensGrid = document.getElementById('screens-grid');
        const shareBtn = document.getElementById('share-btn');
        const avatarInput = document.getElementById('avatar-input');
        const nameInput = document.getElementById('nickname-input');
        const updateNameBtn = document.getElementById('update-name-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const largeVideo = document.getElementById('large-video');
        const modalTitle = document.getElementById('modal-title');

        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const chatSendBtn = document.getElementById('chat-send-btn');
        const MAX_CHAT = 20; // 채팅은 최대 20개까지만 표시

        socket.on('connect', () => {
            if (peer) peer.destroy();
            peer = new Peer(socket.id);

            peer.on('call', (call) => {
                call.answer(localStream || undefined);
                call.on('stream', (remoteStream) => {
                    const targetName = otherPlayers[call.peer] ? otherPlayers[call.peer].name : `User ${call.peer.substring(0, 4)}`;
                    addScreenToGrid(call.peer, remoteStream, `${targetName}의 화면`);
                });
            });
        });

        socket.on('activeScreenShares', (ids) => { ids.forEach(id => { if (id !== socket.id) connectToSharingUser(id); }); });
        socket.on('userStartedShare', (id) => { connectToSharingUser(id); });
        socket.on('userStoppedShare', (id) => { removeScreenFromGrid(id); });

        function connectToSharingUser(targetId) {
            if (!peer) return;
            const call = peer.call(targetId, localStream || new MediaStream());
            call.on('stream', (remoteStream) => {
                const targetName = otherPlayers[targetId] ? otherPlayers[targetId].name : `User ${targetId.substring(0, 4)}`;
                addScreenToGrid(targetId, remoteStream, `${targetName}의 화면`);
            });
        }

        // --- Phaser 초경량 세팅 ---
        const config = {
            type: Phaser.AUTO, width: 800, height: 400,
            parent: 'game-container', pixelArt: true,
            physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);

        function preload() {
            createDummySprite(this, 'defaultAvatar', '#48bb78');
            createGridBackground(this);
        }

        function create() {
            gameScene = this;
            this.add.image(400, 200, 'bgGrid');

            this.myPlayer = this.physics.add.sprite(400, 200, 'defaultAvatar');
            this.myPlayer.setCollideWorldBounds(true);
            this.myLabel = this.add.text(400, 170, myName, {
                fontSize: '11px', fill: '#ffffff', backgroundColor: '#000000aa', padding: { x: 3, y: 1 }
            }).setOrigin(0.5);

            this.cursors = this.input.keyboard.createCursorKeys();

            socket.on('currentPlayers', (players) => {
                Object.keys(players).forEach((id) => {
                    if (id !== socket.id) addOtherPlayer(gameScene, id, players[id].x, players[id].y, players[id].name, players[id].avatar);
                });
            });

            socket.on('newPlayer', (p) => { addOtherPlayer(gameScene, p.id, p.x, p.y, p.name, p.avatar); });

            socket.on('playerMoved', (p) => {
                if (otherPlayers[p.id]) {
                    const target = otherPlayers[p.id].sprite;
                    gameScene.tweens.add({ targets: target, x: p.x, y: p.y, duration: 90, ease: 'Linear' });
                    otherPlayers[p.id].label.setPosition(p.x, p.y - 25);
                }
            });

            socket.on('playerRenamed', (d) => {
                if (otherPlayers[d.id]) {
                    otherPlayers[d.id].name = d.name;
                    otherPlayers[d.id].label.setText(d.name);
                    const cardLabel = document.querySelector(`#card-${d.id} .label`);
                    if (cardLabel) cardLabel.innerText = `${d.name}의 화면`;
                }
            });

            socket.on('playerAvatarChanged', (d) => {
                if (otherPlayers[d.id]) {
                    applyTexture(gameScene, otherPlayers[d.id].sprite, `avatar-${d.id}`, d.avatarBase64);
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) {
                    otherPlayers[id].sprite.destroy();
                    otherPlayers[id].label.destroy();
                    delete otherPlayers[id];
                }
                removeScreenFromGrid(id);
            });
        }

        function update(time) {
            if (!this.myPlayer) return;
            const speed = 180;
            let vx = 0, vy = 0;

            // 입력창(닉네임/채팅)에 타이핑 중이면 캐릭터 이동 방지
            const typing = document.activeElement && document.activeElement.tagName === 'INPUT';

            if (!typing) {
                if (this.cursors.left.isDown) vx = -speed;
                else if (this.cursors.right.isDown) vx = speed;
                if (this.cursors.up.isDown) vy = -speed;
                else if (this.cursors.down.isDown) vy = speed;
            }

            this.myPlayer.setVelocity(vx, vy);
            this.myLabel.setPosition(this.myPlayer.x, this.myPlayer.y - 25);

            // 100ms(초당 10번)로 패킷 송신 간격 제한 ➔ 서버 렉 대폭 감소
            if ((vx !== 0 || vy !== 0) && (time - lastSendTime > 100)) {
                lastSendTime = time;
                socket.emit('playerMovement', { x: Math.round(this.myPlayer.x), y: Math.round(this.myPlayer.y) });
            }
        }

        function addOtherPlayer(scene, id, x, y, name, avatarBase64) {
            let sprite = scene.physics.add.sprite(x, y, 'defaultAvatar');

            if (avatarBase64) {
                applyTexture(scene, sprite, `avatar-${id}`, avatarBase64);
            }

            const displayName = name || `User ${id.substring(0, 4)}`;
            const label = scene.add.text(x, y - 25, displayName, {
                fontSize: '11px', fill: '#ffeb3b', backgroundColor: '#000000aa', padding: { x: 3, y: 1 }
            }).setOrigin(0.5);

            otherPlayers[id] = { sprite, label, name: displayName };
        }

        // 텍스처 안전 적용 헬퍼 (안보임 현상 완벽 해결)
        function applyTexture(scene, spriteObj, keyName, base64Data) {
            const img = new Image();
            img.onload = () => {
                if (scene.textures.exists(keyName)) scene.textures.remove(keyName);
                scene.textures.addImage(keyName, img);
                spriteObj.setTexture(keyName);
                spriteObj.setDisplaySize(36, 36);
            };
            img.src = base64Data;
        }

        // --- 이벤트 핸들러 ---
        updateNameBtn.addEventListener('click', changeName);
        nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') changeName(); });

        function changeName() {
            const newName = nameInput.value.trim();
            if (!newName) return;
            myName = newName;
            gameScene.myLabel.setText(myName);
            socket.emit('changeName', myName);
            const myCard = document.querySelector(`#card-${socket.id} .label`);
            if (myCard) myCard.innerText = `${myName}의 화면 (나)`;
        }

        // 초고속 극소형 이미지 압축 (48x48, Low Quality JPEG)
        avatarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 48; canvas.height = 48;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 48, 48);
                    
                    // 용량 최소화 (약 3~5KB 수준으로 극강 압축)
                    const ultraSmallBase64 = canvas.toDataURL('image/jpeg', 0.8);

                    applyTexture(gameScene, gameScene.myPlayer, `avatar-${socket.id}`, ultraSmallBase64);
                    socket.emit('changeAvatar', ultraSmallBase64);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 초경량 화면 공유 (720p, 10 fps)
        shareBtn.addEventListener('click', async () => {
            if (localStream) { stopScreenShare(); return; }
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always", width: { max: 1280 }, height: { max: 720 }, frameRate: { max: 10 } },
                    audio: false
                });
                addScreenToGrid(socket.id, localStream, `${myName}의 화면 (나)`);
                shareBtn.innerText = '🛑 공유 중단'; shareBtn.classList.add('btn-danger');
                socket.emit('startScreenShare');
                Object.keys(otherPlayers).forEach(id => peer.call(id, localStream));
                localStream.getVideoTracks()[0].onended = () => stopScreenShare();
            } catch (err) { console.error(err); }
        });

        function stopScreenShare() {
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            removeScreenFromGrid(socket.id);
            shareBtn.innerText = '🖥️ 화면 공유'; shareBtn.classList.remove('btn-danger');
            socket.emit('stopScreenShare');
        }

        function addScreenToGrid(peerId, stream, title) {
            if (document.getElementById(`card-${peerId}`) || stream.getVideoTracks().length === 0) return;

            const card = document.createElement('div');
            card.className = 'screen-card'; card.id = `card-${peerId}`;
            const video = document.createElement('video');
            video.autoplay = true; video.playsinline = true; video.muted = true; video.srcObject = stream;
            const label = document.createElement('div');
            label.className = 'label'; label.innerText = title;

            card.appendChild(video); card.appendChild(label); screensGrid.appendChild(card);
            card.addEventListener('click', () => {
                modalTitle.innerText = title; largeVideo.srcObject = stream; modalOverlay.style.display = 'flex';
            });
        }

        function removeScreenFromGrid(peerId) {
            const card = document.getElementById(`card-${peerId}`);
            if (card) card.remove();
        }

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            modalOverlay.style.display = 'none'; largeVideo.srcObject = null;
        });

        // --- 채팅 기능 ---
        function sendChat() {
            const text = chatInput.value.trim();
            if (!text) return;
            socket.emit('chatMessage', text); // 서버가 이름/이미지를 붙여 모두에게 전송
            chatInput.value = '';
        }
        chatSendBtn.addEventListener('click', sendChat);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChat(); });

        function addChatMessage(msg) {
            const row = document.createElement('div');
            row.className = 'chat-msg';

            // 아바타 이미지 (없으면 이름 첫 글자로 대체)
            if (msg.avatar) {
                const img = document.createElement('img');
                img.className = 'avatar';
                img.src = msg.avatar;
                row.appendChild(img);
            } else {
                const ph = document.createElement('div');
                ph.className = 'avatar';
                ph.style.background = '#48bb78';
                ph.innerText = (msg.name || '?').substring(0, 1);
                row.appendChild(ph);
            }

            const body = document.createElement('div');
            body.className = 'body';
            const nameEl = document.createElement('div');
            nameEl.className = 'chat-name';
            nameEl.innerText = msg.name || `User ${String(msg.id).substring(0, 4)}`;
            const textEl = document.createElement('div');
            textEl.className = 'chat-text';
            textEl.innerText = msg.text;
            body.appendChild(nameEl); body.appendChild(textEl);
            row.appendChild(body);

            chatMessages.appendChild(row);

            // 20개 초과 시 가장 오래된 메시지 제거
            while (chatMessages.children.length > MAX_CHAT) {
                chatMessages.removeChild(chatMessages.firstChild);
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        socket.on('chatHistory', (msgs) => { (msgs || []).forEach(addChatMessage); });
        socket.on('chatMessage', (msg) => addChatMessage(msg));

        function createDummySprite(scene, key, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color; ctx.beginPath(); ctx.arc(16, 16, 13, 0, Math.PI * 2); ctx.fill();
            scene.textures.addBase64(key, canvas.toDataURL());
        }

        function createGridBackground(scene) {
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 400;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#222'; ctx.fillRect(0, 0, 800, 400);
            ctx.strokeStyle = '#2d3748'; ctx.lineWidth = 1;
            for (let x = 0; x < 800; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 400); ctx.stroke(); }
            for (let y = 0; y < 400; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke(); }
            scene.textures.addBase64('bgGrid', canvas.toDataURL());
        }
    </script>
</body>
</html>
